services:
  shop-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: shop-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD}"
      MSSQL_PID: "Express"
    ports:
      - "1435:1433"
    volumes:
      - shop-db-data:/var/opt/mssql
      - ./InternetShop.Server/Database/init.sql:/tmp/init.sql:ro
    networks:
      - shop-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  shop-server:
    build:
      context: .
      dockerfile: InternetShop.Server/Dockerfile
    image: internetshop-server:latest
    container_name: shop-server
    environment:
      DB_HOST: "shop-db"
      DB_PORT: "1433"
      DB_USER: "sa"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_NAME_PRIMARY: "InternetShopDB_Primary"
      DB_NAME_REPLICA: "InternetShopDB_Replica"
      SERVER_PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      shop-db:
        condition: service_healthy
    networks:
      - shop-network

networks:
  shop-network:
    driver: bridge

volumes:
  shop-db-data: